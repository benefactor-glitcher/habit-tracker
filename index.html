<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Way</title>
<style>
:root {
  --bg: #f2f4f8; --fg: #111; --box: #ffffff; --border: #d1d5db;
  --accent: #2563eb; --muted: #6b7280; font-size: 14px; /* Basis-Schrift leicht verkleinert */
}
body {
  margin: 0; padding: 8px; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: var(--bg); color: var(--fg); overflow-x: hidden;
}
header { position: sticky; top: 0; background: var(--bg); padding-bottom: 4px; z-index: 50; }
.header-row { display: flex; justify-content: space-between; align-items: center; }
.header-center { text-align: center; }
.header-center strong { display: block; font-size: 0.9rem; }
button { border: none; background: var(--accent); color: white; padding: 4px 8px; border-radius: 8px; font-size: 0.8rem; }
.icon-btn { padding: 4px 8px; font-size: 1.1rem; background: transparent; color: var(--accent); font-weight: bold; }

.day-card { background: var(--box); border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-top: 4px; }

/* Kompakterer Fokus-Bereich */
.task-container {
  background-color: #adff2f !important; padding: 8px 10px !important; border-radius: 10px !important;
  margin-bottom: 8px !important; border-left: 5px solid #76b900 !important; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}
.task-header { margin-bottom: 0 !important; font-weight: 900 !important; font-size: 0.65rem !important; color: #3e6300 !important; text-transform: uppercase; }
#taskInput { width: 100% !important; border: none !important; background: transparent !important; color: #000 !important; font-size: 1rem !important; font-weight: 700 !important; outline: none !important; }

/* Engere Habits */
.habit { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
.habit:last-child { border-bottom: none; }
input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); margin-left: 8px; flex-shrink: 0; }

.tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--box); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
.tab-item { flex: 1; text-align: center; font-size: 0.7rem; color: var(--muted); cursor: pointer; }
.tab-item.active { color: var(--accent); font-weight: bold; }
.view { display: none; padding-bottom: 70px; }
.view.active { display: block; }

/* Statistik kompakt */
.stats-card { background: var(--box); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.trend-row { display: flex; align-items: center; margin-bottom: 8px; }
.trend-day { width: 40px; font-size: 0.75rem; font-weight: bold; }
.trend-bar-bg { flex-grow: 1; height: 10px; background: var(--bg); border-radius: 5px; margin: 0 8px; overflow: hidden; }
.trend-bar-fill { height: 100%; background: #adff2f; transition: width 0.5s ease; }
.trend-percent { width: 30px; text-align: right; font-size: 0.7rem; color: var(--muted); }

.today-btn { margin-top: 2px; padding: 2px 8px; font-size: 0.7rem; border-radius: 999px; background: rgba(37, 99, 235, 0.15); color: var(--accent); }

@media (prefers-color-scheme: dark) {
  :root { --bg: #0f172a; --fg: #e5e7eb; --box: #1e293b; --border: #334155; --muted: #9ca3af; }
}
.stats-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}
.info-tile {
    background: var(--box);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    text-align: center;
}
.info-val { display: block; font-size: 1.2rem; font-weight: bold; color: #adff2f; }
.info-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.habit-list-small { text-align: left; font-size: 0.75rem; margin-top: 5px; list-style: none; padding: 0; }
.habit-list-small li { margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

</style>
</head>
<body>

<div id="view-tracker" class="view active">
  <header>
    <div class="header-row">
      <button class="icon-btn" onclick="prevDay()">←</button>
      <div class="header-center">
        <strong id="dateLabel"></strong>
        <button id="todayBtn" class="today-btn" onclick="goToday()" style="display:none">Heute</button>
      </div>
      <button class="icon-btn" onclick="nextDay()">→</button>
    </div>
  </header>
  <section class="day-card" id="dayCard"></section>
</div>

<div id="view-stats" class="view">
  <div style="padding: 15px;">
    <h2 style="font-size: 1.2rem;">7-Tage-Trend</h2>
    <div id="statsContainer"></div>
  </div>
</div>

<div id="view-focus" class="view">
  <div style="padding: 15px;">
    <h2 style="font-size: 1.2rem;">Fokus-Historie</h2>
    <div id="focusHistoryContainer"></div>
  </div>
</div>

<nav class="tab-bar">
  <div class="tab-item active" onclick="switchView('tracker', this)"><div>📅</div>Tracker</div>
  <div class="tab-item" onclick="switchView('stats', this)"><div>📊</div>Statistik</div>
  <div class="tab-item" onclick="switchView('focus', this)"><div>🎯</div>Fokus</div>
</nav>

<script>
const HABITS = [
  "Schlafhygiene (22:00–05:00)", "Morgensport / Yoga", "3x Aktivitätsringe",
  "10k Alltagsschritte", "Protein mind. 200g", "Pures Wasser mind. 2L",
  "No P*rn", "Zähne putzen (Morgens)", "Zähne putzen (Abends)"
];

let currentDate = new Date();
const iso = (d) => d.toISOString().slice(0,10);

function weekNumber(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date - yearStart) / 86400000) + 1)/7);
}

function renderDay() {
  const key = iso(currentDate);
  const data = JSON.parse(localStorage.getItem(key)) || {};
  
  document.getElementById("dateLabel").textContent = currentDate.toLocaleDateString("de-DE", { 
    weekday: "long", day: "2-digit", month: "2-digit"
  }) + " (KW " + weekNumber(currentDate) + ")";

  const card = document.getElementById("dayCard");
  card.innerHTML = "";

  const taskBox = document.createElement("div");
  taskBox.className = "task-container";
  taskBox.innerHTML = `<div class="task-header">Fokus des Tages</div>`;
  const tInp = document.createElement("input");
  tInp.id = "taskInput"; tInp.placeholder = "Was ist heute wichtig?";
  tInp.value = data.task || data.note || "";
  tInp.onchange = () => { data.task = tInp.value; localStorage.setItem(key, JSON.stringify(data)); };
  taskBox.appendChild(tInp);
  card.appendChild(taskBox);

  HABITS.forEach(h => {
    const row = document.createElement("div");
    row.className = "habit";
    row.innerHTML = `<span>${h}</span>`;
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = data[h] === true;
    cb.onchange = () => { data[h] = cb.checked; localStorage.setItem(key, JSON.stringify(data)); };
    row.appendChild(cb);
    card.appendChild(row);
  });

  // --- FIX: Bonus-Habit täglich individuell ---
// Wir laden den Namen nicht mehr aus einem globalen Key, 
// sondern aus dem 'data' Objekt des jeweiligen Tages.
const bName = data["bonus_habit_name"] || ""; // Standardmäßig leer für neuen Tag

const bRow = document.createElement("div");
bRow.className = "habit";
bRow.style.borderTop = "1px solid var(--accent)";
bRow.style.marginTop = "4px"; 
bRow.style.paddingTop = "4px";

const bInp = document.createElement("input");
bInp.style = "border:none; background:transparent; font-size:0.85rem; font-weight:bold; width:70%; color:var(--fg); outline:none;";
bInp.placeholder = "Bonus-Habit heute..."; // Platzhalter falls leer
bInp.value = bName;

// Beim Ändern des Namens wird dieser nur für das aktuelle Datum (key) gespeichert
bInp.onchange = () => {
    data["bonus_habit_name"] = bInp.value;
    localStorage.setItem(key, JSON.stringify(data));
};

const bCb = document.createElement("input");
bCb.type = "checkbox";
bCb.checked = data["bonus_habit_status"] === true;
bCb.onchange = () => {
    data["bonus_habit_status"] = bCb.checked;
    localStorage.setItem(key, JSON.stringify(data));
};

bRow.appendChild(bInp);
bRow.appendChild(bCb);
card.appendChild(bRow);

  const todayBtn = document.getElementById("todayBtn");
  const isToday = currentDate.toDateString() === new Date().toDateString();
  if (todayBtn) todayBtn.style.display = isToday ? "none" : "inline-block";
}

function updateStatistics() {
  const container = document.getElementById("statsContainer");
  if (!container) return;
  container.innerHTML = "";
  
  let statsHTML = '<div class="stats-card">';
  const now = new Date();

  // 1. TEIL: DIE KW-BALKEN (4 WOCHEN)
  for (let w = 0; w < 4; w++) {
    let weekDone = 0;
    let weekTotal = 0;
    const d = new Date();
    d.setDate(d.getDate() - (d.getDay() || 7) + 1 - (w * 7));
    const kwNum = weekNumber(d);

    for (let i = 0; i < 7; i++) {
      const day = new Date(d);
      day.setDate(d.getDate() + i);
      const key = iso(day);
      const data = JSON.parse(localStorage.getItem(key)) || {};
      
      if (day <= now) {
        HABITS.forEach(h => { 
          weekTotal++; 
          if (data[h] === true) weekDone++; 
        });
        weekTotal++;
        if (data["bonus_habit_status"] === true) weekDone++;
      }
    }
    const percent = weekTotal > 0 ? Math.round((weekDone / weekTotal) * 100) : 0;
    const label = w === 0 ? "Diese KW" : `KW ${kwNum}`;

    statsHTML += `
      <div class="trend-row">
        <div class="trend-day" style="width: 70px;">${label}</div>
        <div class="trend-bar-bg"><div class="trend-bar-fill" style="width:${percent}%"></div></div>
        <div class="trend-percent">${percent}%</div>
      </div>`;
  }
  statsHTML += '</div>';

  // 2. TEIL: STREAKS & ANALYSE
  let streak = 0;
  let habitCounts = {};
  HABITS.forEach(h => habitCounts[h] = 0);

  for (let i = 0; i < 30; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const dayKey = iso(d);
    const data = JSON.parse(localStorage.getItem(dayKey)) || {};
    let doneCount = 0;
    
    HABITS.forEach(h => {
      if (data[h] === true) {
        doneCount++;
        if (i < 7) habitCounts[h]++; 
      }
    });
    if (data["bonus_habit_status"] === true) doneCount++;

    const dailyTarget = (HABITS.length + 1) * 0.6;
    if (doneCount >= dailyTarget) {
      if (i === streak) streak++; 
    } else if (i < streak) {
      break; 
    }
  }

  let sortedHabits = Object.keys(habitCounts).sort((a, b) => habitCounts[b] - habitCounts[a]);
  let topHabit = sortedHabits[0] || "Keine Daten";
  let flopHabit = sortedHabits[sortedHabits.length - 1] || "Keine Daten";

  // 3. TEIL: KACHELN
  statsHTML += `
    <div class="stats-info-grid">
      <div class="info-tile">
        <span class="info-label">Aktueller Streak</span>
        <span class="info-val">🔥 ${streak} Tage</span>
      </div>
      <div class="info-tile">
        <span class="info-label">Top Habit (7T)</span>
        <div class="habit-list-small" style="color: #adff2f;">🏆 ${topHabit}</div>
      </div>
    </div>
    <div class="info-tile" style="margin-top: 10px; text-align: left;">
      <span class="info-label">Sorgenkind (Letzte 7 Tage)</span>
      <div class="habit-list-small" style="color: #ef4444;">⚠️ ${flopHabit}</div>
    </div>
  `;

  // 4. TEIL: 14-TAGE-DIAGRAMM
  statsHTML += `
    <div style="margin-top:25px;">
      <span class="info-label" style="margin-left:5px;">14-Tage Aktivität</span>
      <div class="activity-chart">`;
  
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const data = JSON.parse(localStorage.getItem(iso(d))) || {};
    let done = 0;
    HABITS.forEach(h => { if (data[h] === true) done++; });
    if (data["bonus_habit_status"] === true) done++;
    
    const p = ((done / (HABITS.length + 1)) * 100);
    
    // Fallback: Wenn p = 0 ist (keine Daten auf GitHub), erzwingen wir 10% Höhe, damit man die leeren giftgrünen Balken sieht!
    statsHTML += `<div class="activity-bar ${p > 65 ? 'high' : ''}" style="height:${Math.max(p, 10)}%"></div>`;
  }
  
  statsHTML += `</div></div>`;

  container.innerHTML = statsHTML;
}
function updateFocusHistory() {
  const container = document.getElementById("focusHistoryContainer");
  if (!container) return;
  container.innerHTML = "";
  let focusHTML = "";

  // Wir gehen die letzten 14 Tage durch
  for (let i = 0; i < 14; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = iso(d);
    const data = JSON.parse(localStorage.getItem(key)) || {};
    
    const taskText = data.task || "";
    const bonusText = data.bonus_habit_name || "";

    // Nur anzeigen, wenn mindestens eines der beiden Felder gefüllt ist
    if (taskText || bonusText) {
      const label = i === 0 ? "Heute" : d.toLocaleDateString("de-DE", {weekday: 'short', day: '2-digit', month: '2-digit'});
      
      focusHTML += `
        <div class="focus-item" style="padding: 12px 0; border-bottom: 1px dashed var(--border);">
          <div style="font-size: 0.75rem; color: var(--muted); font-weight: bold; margin-bottom: 4px;">${label}</div>
          ${taskText ? `<div style="font-size: 0.95rem; font-weight: 700; color: #adff2f;">🎯 ${taskText}</div>` : ''}
          ${bonusText ? `<div style="font-size: 0.85rem; color: var(--fg); margin-top: 2px;">✨ ${bonusText}</div>` : ''}
        </div>`;
    }
  }
  container.innerHTML = focusHTML || '<div style="color: var(--muted); padding: 40px; text-align: center;">Noch keine Einträge für Fokus oder Bonus vorhanden.</div>';
}

function switchView(viewId, el) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + viewId).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (viewId === 'stats') updateStatistics();
if (viewId === 'focus') updateFocusHistory();
}

function nextDay() { currentDate.setDate(currentDate.getDate() + 1); renderDay(); }
function prevDay() { currentDate.setDate(currentDate.getDate() - 1); renderDay(); }
function goToday() { currentDate = new Date(); renderDay(); }

// --- SWIPE LOGIK REPARIERT ---
let touchstartX = 0;
let touchendX = 0;

function handleGesture() {
  const threshold = 50;
  if (touchendX < touchstartX - threshold) nextDay();
  if (touchendX > touchstartX + threshold) prevDay();
}

document.addEventListener('touchstart', e => {
  touchstartX = e.changedTouches[0].screenX;
}, false);

document.addEventListener('touchend', e => {
  touchendX = e.changedTouches[0].screenX;
  handleGesture();
}, false);

renderDay();
</script>
</body>
</html>
