<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Way</title>

<style>
:root {
  --bg: #f2f4f8;
  --fg: #111;
  --box: #ffffff;
  --border: #d1d5db;
  --accent: #2563eb;
  --muted: #6b7280;
  font-size: 15px;
}

body {
  margin: 0;
  padding: 12px;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
}

/* Header */
header {
  position: sticky;
  top: 0;
  background: var(--bg);
  padding-bottom: 8px;
  z-index: 50;
}

.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header-center {
  text-align: center;
}

.header-center strong {
  display: block;
}

small {
  color: var(--muted);
}

/* Buttons */
button {
  border: none;
  background: var(--accent);
  color: white;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 0.85rem;
}

.icon-btn {
  padding: 6px 8px;
  font-size: 1rem;
}

/* Day Card */
.day-card {
  background: var(--box);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  margin-top: 12px;
}

/* Habits */
.habit {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 6px;
  border-bottom: 1px solid var(--border);
  font-size: 0.95rem;
}

.habit:last-child {
  border-bottom: none;
}

input[type="checkbox"] {
  width: 26px;
  height: 26px;
  accent-color: var(--accent);
}

/* Fokus des Tages - Giftgrün Highlight */
.task-container {
  background: rgba(132, 204, 22, 0.2) !important; /* Giftgrüner Hintergrund */
  padding: 12px !important;
  border-radius: 12px !important;
  margin-bottom: 15px !important;
  border-left: 5px solid #84cc16 !important; /* Kräftige giftgrüne Linie */
  display: block !important;
}

.task-header {
  margin-bottom: 4px !important;
  font-weight: 800 !important;
  font-size: 0.75rem !important;
  color: #4d7c0f !important; /* Dunkelgrün für Lesbarkeit */
  text-transform: uppercase !important;
  letter-spacing: 0.05em !important;
}

#taskInput {
  width: 100% !important;
  padding: 5px 0 !important;
  font-size: 1.1rem !important;
  font-weight: 700 !important;
  border: none !important;
  background: transparent !important;
  color: #111 !important; /* Im Hellen dunkel für Kontrast */
  outline: none !important;
}

/* Anpassung für Dark Mode */
@media (prefers-color-scheme: dark) {
  #taskInput {
    color: #f2f4f8 !important;
  }
}/* =====================
   SYSTEM DARK MODE
   ===================== */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a;
    --fg: #e5e7eb;
    --box: #1e293b;
    --border: #334155;
    --muted: #9ca3af;
  }
}

/* Slide Animation */
.slide-out-left { animation: slideOutLeft 0.18s ease-in forwards; }
.slide-out-right { animation: slideOutRight 0.18s ease-in forwards; }
.slide-in-left { animation: slideInLeft 0.18s ease-out forwards; }
.slide-in-right { animation: slideInRight 0.18s ease-out forwards; }

@keyframes slideOutLeft {
  from { transform: translateX(0); opacity: 1; }
  to { transform: translateX(-40px); opacity: 0; }
}
@keyframes slideOutRight {
  from { transform: translateX(0); opacity: 1; }
  to { transform: translateX(40px); opacity: 0; }
}
@keyframes slideInLeft {
  from { transform: translateX(40px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes slideInRight {
  from { transform: translateX(-40px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

.today-btn {
  margin-top: 4px;
  padding: 4px 10px;
  font-size: 0.75rem;
  border-radius: 999px;
  background: rgba(37, 99, 235, 0.15);
  color: var(--accent);
}
/* --- DIES GANZ AM ENDE DES <STYLE> BEREICHS EINFÜGEN --- */

.task-container {
  background-color: #adff2f !important; /* Echtes Giftgrün (GreenYellow) */
  padding: 12px !important;
  border-radius: 12px !important;
  margin-bottom: 15px !important;
  border-left: 6px solid #76b900 !important; /* Dunklerer grüner Rand */
  display: block !important;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1); /* Kleiner Schatten für Tiefe */
}

.task-header {
  margin-bottom: 2px !important;
  font-weight: 900 !important;
  font-size: 0.7rem !important;
  color: #3e6300 !important; /* Sehr dunkles Grün für die Lesbarkeit */
  text-transform: uppercase !important;
}

#taskInput {
  width: 100% !important;
  padding: 0 !important;
  font-size: 1.1rem !important;
  font-weight: 700 !important;
  border: none !important;
  background: transparent !important;
  color: #000 !important; /* Text immer schwarz auf giftgrünem Grund */
  outline: none !important;
}

/* Verhindert Dark-Mode Konflikte für diesen speziellen Bereich */
@media (prefers-color-scheme: dark) {
  .task-container { background-color: #adff2f !important; }
  #taskInput { color: #000 !important; }
  .task-header { color: #3e6300 !important; }
/* Menüleiste unten */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: var(--box);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

.tab-item {
  flex: 1;
  text-align: center;
  font-size: 0.7rem;
  color: var(--muted);
  cursor: pointer;
}

.tab-item.active {
  color: var(--accent);
  font-weight: bold;
}

/* Container für verschiedene Ansichten */
.view {
  display: none; /* Standardmäßig alles verstecken */
  padding-bottom: 80px; /* Platz für die Menüleiste */
}

.view.active {
  display: block; /* Nur die aktive Ansicht zeigen */
}
</style>
</head>

<body>


<header>
  <div class="header-row">
    <button class="icon-btn" onclick="prevDay()">←</button>

    <div class="header-center">
      <strong id="dateLabel"></strong>
      <button
        id="todayBtn"
        class="today-btn"
        onclick="goToday()"
        style="display:none">
        Heute
      </button>
    </div>

    <button class="icon-btn" onclick="nextDay()">→</button>
  </div>
</header>

<section class="day-card" id="dayCard"></section>


<script>
/* STATE */
const HABITS = [
  "Schlafhygiene eingehalten (22:00–05:00)",
  "Morgensport / Yoga",
  "Alle 3x Aktivitätsringe abgeschlossen",
  "10k Alltagsschritte gemacht",
  "Protein mind. 200g",
  "Pures Wasser mind. 2L",
  "No P*rn",
 "Zähne putzen (Morgens)",
  "Zähne putzen (Abends)"
];

let currentDate = new Date();

/* DATE HELPERS */
function iso(d){ return d.toISOString().slice(0,10); }

function weekNumber(d){
  d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
}

/* RENDER */
function renderDay() {
  const key = iso(currentDate);
  const data = JSON.parse(localStorage.getItem(key)) || {};

  // Datum setzSen
  const dateLabel = document.getElementById("dateLabel");
  dateLabel.textContent =
    currentDate.toLocaleDateString("de-DE", {
      weekday: "long",
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }) + " (KW " + weekNumber(currentDate) + ")";

  const card = document.getElementById("dayCard");
  card.innerHTML = "";

// --- Task/Fokus Bereich ---
  const taskBox = document.createElement("div");
  taskBox.className = "task-container";

  const tHeader = document.createElement("div");
  tHeader.className = "task-header";
  tHeader.textContent = "Fokus des Tages";
  taskBox.appendChild(tHeader);

  const tInput = document.createElement("input");
  tInput.id = "taskInput";
  tInput.placeholder = "Was ist heute wichtig?";
  tInput.value = data.task || data.note || ""; 
  tInput.onchange = () => {
    data.task = tInput.value;
    localStorage.setItem(key, JSON.stringify(data));
  };
  
  taskBox.appendChild(tInput);
  card.appendChild(taskBox);
  // -------------------------

  // Habits rendern
  HABITS.forEach(h => {
    const row = document.createElement("div");
    row.className = "habit";

    const label = document.createElement("span");
    label.textContent = h;

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = data[h] === true;

    cb.onchange = () => {
      data[h] = cb.checked;
      localStorage.setItem(key, JSON.stringify(data));
    };

    row.appendChild(label);
    row.appendChild(cb);
    card.appendChild(row);
  });

  // Heute-Button Logik
  const todayBtn = document.getElementById("todayBtn");
  const isToday = currentDate.toDateString() === new Date().toDateString();
  if (todayBtn) {
    todayBtn.style.display = isToday ? "none" : "inline-block";
  }
}

/* NAV */
function nextDay() {
  animateDay("left", () => currentDate.setDate(currentDate.getDate() + 1));
}

function prevDay() {
  animateDay("right", () => currentDate.setDate(currentDate.getDate() - 1));
}
function goToday() {
  currentDate = new Date();
  renderDay();
}

function animateDay(direction, changeDate) {
  const card = document.getElementById("dayCard");

  card.classList.add(direction === "left" ? "slide-out-left" : "slide-out-right");

  setTimeout(() => {
    changeDate();
    renderDay();

    card.classList.remove("slide-out-left", "slide-out-right");
    card.classList.add(direction === "left" ? "slide-in-right" : "slide-in-left");

    setTimeout(() => {
      card.classList.remove("slide-in-left", "slide-in-right");
    }, 180);
  }, 180);
}

/* INIT */
renderDay();

/* SWIPE */
let touchStartX = 0;
let touchEndX = 0;
const swipeThreshold = 60;

document.addEventListener("touchstart", e => {
  touchStartX = e.changedTouches[0].screenX;
});
document.addEventListener("touchend", e => {
  touchEndX = e.changedTouches[0].screenX;
  const diff = touchEndX - touchStartX;
  if (Math.abs(diff) < swipeThreshold) return;
  diff > 0 ? prevDay() : nextDay();
});
</script>

</body>
</html>
