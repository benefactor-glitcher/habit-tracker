<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Way</title>

<style>
:root {
  --bg: #f2f4f8;
  --fg: #111;
  --box: #ffffff;
  --border: #d1d5db;
  --accent: #2563eb;
  --muted: #6b7280;
  font-size: 15px;
}

body {
  margin: 0;
  padding: 12px;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
}

/* Header & Navigation */
header {
  position: sticky;
  top: 0;
  background: var(--bg);
  padding-bottom: 4px;
  z-index: 50;
}
.header-row { display: flex; justify-content: space-between; align-items: center; }
.header-center { text-align: center; }
.header-center strong { display: block; }

/* Buttons */
button { border: none; background: var(--accent); color: white; padding: 6px 10px; border-radius: 8px; font-size: 0.85rem; }
.icon-btn { padding: 6px 8px; font-size: 1rem; }
.today-btn { margin-top: 4px; padding: 4px 10px; font-size: 0.75rem; border-radius: 999px; background: rgba(37, 99, 235, 0.15); color: var(--accent); }

/* Views & Tabs */
.view { display: none; padding-bottom: 80px; }
.view.active { display: block; }

.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 65px;
  background: var(--box); border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center; z-index: 100;
}
.tab-item { flex: 1; text-align: center; font-size: 0.75rem; color: var(--muted); cursor: pointer; }
.tab-item.active { color: var(--accent); font-weight: bold; }

/* Day Card & Habits */
.day-card { background: var(--box); border: 1px solid var(--border); border-radius: 14px; padding: 10px; margin-top: 8px; }
.habit { display: flex; justify-content: space-between; align-items: center; padding: 6px 6px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
.habit:last-child { border-bottom: none; }
input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }

/* Fokus Box (Giftgrün) */
.task-container {
  background-color: #adff2f !important; padding: 8px 12px !important; border-radius: 10px !important;
  margin-bottom: 8px !important; border-left: 5px solid #76b900 !important;
}
.task-header { margin-bottom: 2px !important; font-weight: 900 !important; font-size: 0.7rem !important; color: #3e6300 !important; text-transform: uppercase; }
#taskInput { width: 100% !important; border: none !important; background: transparent !important; color: #000 !important; font-size: 1.1rem !important; font-weight: 700 !important; outline: none !important; }

/* Statistik Styles */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.stat-tile { background: var(--box); padding: 12px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
.stat-val { display: block; font-size: 1.2rem; font-weight: 800; color: #84cc16; }
.stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
.stats-card { background: var(--box); border: 1px solid var(--border); border-radius: 16px; padding: 15px; }
.trend-row { display: flex; align-items: center; margin-bottom: 12px; }
.trend-day { width: 45px; font-size: 0.8rem; font-weight: bold; }
.trend-bar-bg { flex-grow: 1; height: 12px; background: var(--bg); border-radius: 6px; margin: 0 10px; overflow: hidden; }
.trend-bar-fill { height: 100%; background: #adff2f; transition: width 0.5s ease; }
.trend-percent { width: 35px; text-align: right; font-size: 0.75rem; color: var(--muted); }
.focus-item { font-size: 0.85rem; padding: 8px 0; border-bottom: 1px dashed var(--border); }
.focus-item span { color: var(--muted); margin-right: 8px; font-weight: bold; }

/* Dark Mode */
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f172a; --fg: #e5e7eb; --box: #1e293b; --border: #334155; --muted: #9ca3af; }
  #taskInput { color: #000 !important; } /* Text auf giftgrün bleibt schwarz */
}

/* Animations */
.slide-out-left { animation: slideOutLeft 0.18s ease-in forwards; }
.slide-out-right { animation: slideOutRight 0.18s ease-in forwards; }
.slide-in-left { animation: slideInLeft 0.18s ease-out forwards; }
.slide-in-right { animation: slideInRight 0.18s ease-out forwards; }
@keyframes slideOutLeft { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-40px); opacity: 0; } }
@keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(40px); opacity: 0; } }
@keyframes slideInLeft { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes slideInRight { from { transform: translateX(-40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>

<body>

<div id="view-tracker" class="view active">
  <header>
    <div class="header-row">
      <button class="icon-btn" onclick="prevDay()">←</button>
      <div class="header-center">
        <strong id="dateLabel"></strong>
        <button id="todayBtn" class="today-btn" onclick="goToday()" style="display:none">Heute</button>
      </div>
      <button class="icon-btn" onclick="nextDay()">→</button>
    </div>
  </header>
  <section class="day-card" id="dayCard"></section>
</div>

<div id="view-stats" class="view">
  <div style="padding: 20px;">
    <h2 style="margin-bottom: 5px;">7-Tage-Trend</h2>
    <small style="color: var(--muted); display: block; margin-bottom: 20px;">Deine Performance</small>
    <div id="statsContainer"></div>
  </div>
</div>

<nav class="tab-bar">
  <div class="tab-item active" onclick="switchView('tracker', this)"><div>📅</div>Tracker</div>
  <div class="tab-item" onclick="switchView('stats', this)"><div>📊</div>Statistik</div>
</nav>

<script>
// 1. Grundlegende Daten & Hilfsfunktionen zuerst definieren
const HABITS = [
  "Schlafhygiene (22:00–05:00)", "Morgensport / Yoga", "Alle 3x Aktivitätsringe",
  "10k Alltagsschritte", "Protein mind. 200g", "Pures Wasser mind. 2L",
  "No P*rn", "Zähne putzen (Morgens)", "Zähne putzen (Abends)"
];

let currentDate = new Date();

// Diese Funktion muss VOR renderDay stehen
const iso = (d) => {
  try {
    return d.toISOString().slice(0, 10);
  } catch(e) {
    return new Date().toISOString().slice(0, 10);
  }
};

function weekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}

// 2. Die Hauptfunktion
function renderDay() {
  const key = iso(currentDate);
  let data = {};
  
  try {
    const saved = localStorage.getItem(key);
    if (saved) data = JSON.parse(saved);
  } catch(e) { console.error("Datenfehler", e); }

  // Elemente suchen (mit Sicherheitscheck)
  const dateLabel = document.getElementById("dateLabel");
  const card = document.getElementById("dayCard");
  const todayBtn = document.getElementById("todayBtn");

  if (!dateLabel || !card) return; // Falls HTML noch nicht bereit ist

  // Datum setzen
  dateLabel.textContent = currentDate.toLocaleDateString("de-DE", { 
    weekday: "long", day: "2-digit", month: "2-digit", year: "numeric" 
  }) + " (KW " + weekNumber(currentDate) + ")";

  card.innerHTML = "";

  // A. Fokus Bereich
  const taskBox = document.createElement("div");
  taskBox.className = "task-container";
  taskBox.innerHTML = `<div class="task-header">Fokus des Tages</div>`;
  const tInp = document.createElement("input");
  tInp.id = "taskInput";
  tInp.value = data.task || data.note || "";
  tInp.placeholder = "Was ist heute wichtig?";
  tInp.onchange = () => {
    data.task = tInp.value;
    localStorage.setItem(key, JSON.stringify(data));
  };
  taskBox.appendChild(tInp);
  card.appendChild(taskBox);

  // B. Habits rendern
  HABITS.forEach(h => {
    const row = document.createElement("div");
    row.className = "habit";
    row.innerHTML = `<span>${h}</span>`;
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = data[h] === true;
    cb.onchange = () => {
      data[h] = cb.checked;
      localStorage.setItem(key, JSON.stringify(data));
    };
    row.appendChild(cb);
    card.appendChild(row);
  });

  // C. Bonus Habit
  const bonusKey = "custom_habit_name";
  const bName = localStorage.getItem(bonusKey) || "Bonus-Habit";
  const bRow = document.createElement("div");
  bRow.className = "habit";
  bRow.style.borderTop = "1px solid var(--accent)";
  bRow.style.marginTop = "4px";
  bRow.style.paddingTop = "8px";
  
  const bInp = document.createElement("input");
  bInp.style = "border:none; background:transparent; font-size:0.9rem; font-weight:bold; width:70%; color:var(--fg); outline:none;";
  bInp.value = bName;
  bInp.onchange = () => localStorage.setItem(bonusKey, bInp.value);
  
  const bCb = document.createElement("input");
  bCb.type = "checkbox";
  bCb.checked = data["bonus_habit_status"] === true;
  bCb.onchange = () => {
    data["bonus_habit_status"] = bCb.checked;
    localStorage.setItem(key, JSON.stringify(data));
  };
  
  bRow.appendChild(bInp);
  bRow.appendChild(bCb);
  card.appendChild(bRow);

  // Heute Button Logik
  if (todayBtn) {
    const isToday = currentDate.toDateString() === new Date().toDateString();
    todayBtn.style.display = isToday ? "none" : "inline-block";
  }
}

// 3. Navigation & Statistik
function switchView(viewId, el) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const target = document.getElementById('view-' + viewId);
  if (target) target.classList.add('active');
  
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  
  if (viewId === 'stats') updateStatistics();
}

function updateStatistics() {
  const container = document.getElementById("statsContainer");
  if (!container) return;
  container.innerHTML = "";
  let totalPercent = 0, focusHTML = "", trendHTML = "";

  for (let i = 0; i < 7; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = iso(d);
    const data = JSON.parse(localStorage.getItem(key)) || {};
    let done = 0;
    HABITS.forEach(h => { if (data[h] === true) done++; });
    if (data["bonus_habit_status"] === true) done++;
    const percent = Math.round((done / (HABITS.length + 1)) * 100);
    totalPercent += percent;

    const label = i === 0 ? "Heute" : d.toLocaleDateString("de-DE", {weekday: 'short'});
    trendHTML += `<div class="trend-row"><div class="trend-day">${label}</div><div class="trend-bar-bg"><div class="trend-bar-fill" style="width:${percent}%"></div></div><div class="trend-percent">${percent}%</div></div>`;
    if (data.task || data.note) focusHTML += `<div class="focus-item"><span>${label}:</span> ${data.task || data.note}</div>`;
  }

  container.innerHTML = `
    <div class="stats-grid">
      <div class="stat-tile"><span class="stat-val">${Math.round(totalPercent/7)}%</span><span class="stat-label">Schnitt</span></div>
      <div class="stat-tile"><span class="stat-val">7</span><span class="stat-label">Tage</span></div>
    </div>
    <div class="stats-card">${trendHTML}</div>
    <div class="focus-history" style="margin-top:20px;">${focusHTML || 'Keine Einträge'}</div>`;
}

// Steuerung
function nextDay() { currentDate.setDate(currentDate.getDate() + 1); renderDay(); }
function prevDay() { currentDate.setDate(currentDate.getDate() - 1); renderDay(); }
function goToday() { currentDate = new Date(); renderDay(); }

// Start
// Startet die App erst, wenn wirklich alles bereit ist
if (document.readyState === "complete" || document.readyState === "interactive") {
    renderDay();
} else {
    document.addEventListener("DOMContentLoaded", renderDay);
}
</script>
</body>
</html>
